name = "bibliohelpc-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

workers_dev = false
# API only, by decision (2026-08-11): the app is served from GitHub Pages
# (rijdho.github.io/bibliohelp/app/) permanently. A worker-assets migration was
# built and then reverted the same day — do not re-add [assets] without also
# re-deciding the canonical frontend; the git history has the working config.
routes = [
  { pattern = "api.bibliohelp.rijdho.org", custom_domain = true }
]

[vars]
APP_NAME = "BiblioHelp"
APP_DOMAIN = "bibliohelp.rijdho.org"
API_MAILTO = "bibliohelp@example.com"
MAX_BODY_SIZE = "50000"
MAX_REFERENCES = "30"
PAGES_DOMAIN = "bibliohelpc.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "bibliohelpc-references"
database_id = "422b4459-88dc-4cf5-a6fa-443aa046fed8"

[[vectorize]]
binding = "VECTORIZE"
index_name = "bibliohelpc-embeddings"

[ai]
binding = "AI"
