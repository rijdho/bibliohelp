<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- GitHub Pages cannot send response headers, so the CSP travels in the
         document itself. frame-ancestors is omitted: the spec ignores it in a
         meta tag (framing policy only exists where headers exist — the
         Cloudflare surfaces). Keep in sync with frontend/static/_headers. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://appsforoffice.microsoft.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.bibliohelp.rijdho.org; img-src 'self' data:; font-src 'self' data:"
    />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <title>%sveltekit.env.VITE_APP_NAME%</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
